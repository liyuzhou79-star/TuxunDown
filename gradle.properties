org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# v2.0.0 slimming: R8 full mode shrinks and obfuscates more
# aggressively than the default mode. The app uses no reflection,
# no serialization framework and no JNI of its own; the libraries
# (Compose, coroutines) ship consumer rules that full mode honours.
android.enableR8.fullMode=true
