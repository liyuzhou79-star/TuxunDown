name: Build Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.2.0"
        required: true
      dry_run:
        description: "Unsigned dry run: skip secrets/signing, build release APK only to verify R8 build and size"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Check release secrets are all present
        if: ${{ !inputs.dry_run }}
        env:
          S_KEYSTORE_BASE64: ${{ secrets.TUXUNDOWN_KEYSTORE_BASE64 }}
          S_KEYSTORE_PASSWORD: ${{ secrets.TUXUNDOWN_KEYSTORE_PASSWORD }}
          S_KEY_ALIAS: ${{ secrets.TUXUNDOWN_KEY_ALIAS }}
          S_KEY_PASSWORD: ${{ secrets.TUXUNDOWN_KEY_PASSWORD }}
        run: |
          missing=0
          for pair in \
            "TUXUNDOWN_KEYSTORE_BASE64=$S_KEYSTORE_BASE64" \
            "TUXUNDOWN_KEYSTORE_PASSWORD=$S_KEYSTORE_PASSWORD" \
            "TUXUNDOWN_KEY_ALIAS=$S_KEY_ALIAS" \
            "TUXUNDOWN_KEY_PASSWORD=$S_KEY_PASSWORD"; do
            name="${pair%%=*}"
            value="${pair#*=}"
            if [ -z "$value" ]; then
              echo "::error::Secret $name is missing; refusing to build a release without the formal signing key."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "All release secrets present."

      - name: Restore signing keystore from secrets
        if: ${{ !inputs.dry_run }}
        env:
          KEYSTORE_BASE64: ${{ secrets.TUXUNDOWN_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          ls -la "$RUNNER_TEMP/release.keystore"

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build release APK (signed)
        if: ${{ !inputs.dry_run }}
        env:
          TUXUNDOWN_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          TUXUNDOWN_STORE_PASSWORD: ${{ secrets.TUXUNDOWN_KEYSTORE_PASSWORD }}
          TUXUNDOWN_KEY_ALIAS: ${{ secrets.TUXUNDOWN_KEY_ALIAS }}
          TUXUNDOWN_KEY_PASSWORD: ${{ secrets.TUXUNDOWN_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Build release APK (unsigned dry run)
        if: ${{ inputs.dry_run }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify formal signing certificate fingerprint
        if: ${{ !inputs.dry_run }}
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK: $APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | head -8
          python3 - <<'EOF'
          import struct, hashlib, glob
          path = sorted(glob.glob("app/build/outputs/apk/release/*.apk"))[0]
          data = open(path, "rb").read()
          eocd = data.rfind(b"PK\x05\x06")
          cd_off = struct.unpack_from("<I", data, eocd + 16)[0]
          magic = data[cd_off - 16:cd_off]
          assert magic == b"APK Sig Block 42", magic
          block_size = struct.unpack_from("<Q", data, cd_off - 24)[0]
          block_start = cd_off - block_size - 8
          pos = block_start + 8
          end = cd_off - 24
          def field(buf, off):
              ln = struct.unpack_from("<I", buf, off)[0]
              return buf[off + 4:off + 4 + ln], off + 4 + ln
          certs = []
          while pos < end:
              pair_len = struct.unpack_from("<Q", data, pos)[0]
              pair_id = struct.unpack_from("<I", data, pos + 8)[0]
              if pair_id == 0x7109871a:
                  v2 = data[pos + 12:pos + 8 + pair_len]
                  signers, _ = field(v2, 0)
                  signer, off = field(signers, 0)
                  signed_data, off2 = field(signer, 0)
                  digests, off3 = field(signed_data, 0)
                  cert_field, _ = field(signed_data, off3)
                  cert, _ = field(cert_field, 0)
                  certs.append(hashlib.sha256(cert).hexdigest())
              pos += 8 + pair_len
          print("certs:", certs)
          assert certs == ["b73a2080f93b8433f4ade626082b0902f0564e260da28ea070bc3433ca5b4513"], certs
          print("formal release signing certificate OK")
          EOF

      # Size gate (added in v5.6.0): the hard red line for this
      # project's release APK is 1.5 MB = 1,572,864 bytes. At
      # v5.5.0 the signed package had grown to 1,482,238 bytes —
      # only ~90 KB under the line — and steady feature growth
      # means "someone eyeballs the size log" is not a reliable
      # guard. So this step is UNCONDITIONAL (no `if:`): it runs
      # on both the signed path and the unsigned dry-run path,
      # after the build steps and before any upload step, prints
      # each APK's total bytes plus a composition summary, and
      # fails the whole run with ::error:: when any APK exceeds
      # 1,572,864 bytes. Composition is summed from each zip
      # entry's compressed size, grouped as dex /
      # resources.arsc / res / lib / other (zip headers, alignment
      # padding and the signing block count toward the total
      # only, so the five groups need not add up to it exactly).
      - name: Report APK size and enforce 1.5 MB gate
        run: |
          ls -la app/build/outputs/apk/release/
          python3 - <<'EOF'
          import glob, os, sys, zipfile
          LIMIT = 1572864  # 1.5 MB red line, see the comment above this step.
          def category(name):
              if name.endswith(".dex"):
                  return "dex"
              if name == "resources.arsc":
                  return "resources.arsc"
              if name.startswith("res/"):
                  return "res"
              if name.startswith("lib/"):
                  return "lib"
              return "other"
          paths = sorted(glob.glob(os.environ.get("APK_DIR", "app/build/outputs/apk/release") + "/*.apk"))
          if not paths:
              print("::error::Size gate: no release APK found to measure.")
              sys.exit(1)
          failed = False
          for path in paths:
              total = os.path.getsize(path)
              groups = {"dex": 0, "resources.arsc": 0, "res": 0, "lib": 0, "other": 0}
              with zipfile.ZipFile(path) as zf:
                  for info in zf.infolist():
                      groups[category(info.filename)] += info.compress_size
              print(f"APK: {path}")
              print(f"  total: {total} bytes (limit {LIMIT} bytes = 1.5 MB)")
              for key in ("dex", "resources.arsc", "res", "lib", "other"):
                  print(f"  {key}: {groups[key]} bytes (compressed entries)")
              if total > LIMIT:
                  print(f"::error::Size gate: {path} is {total} bytes, over the 1.5 MB red line ({LIMIT} bytes) by {total - LIMIT} bytes.")
                  failed = True
              else:
                  print(f"  size gate: PASS ({LIMIT - total} bytes under the red line)")
          sys.exit(1 if failed else 0)
          EOF

      - name: Upload release APK
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: tuxundown-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload dry-run APK
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: tuxundown-release-dryrun-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
